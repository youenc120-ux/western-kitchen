<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>西餐練習簿</title>
<meta name="description" content="開源的西餐與調酒學習 App：料理、醬汁、發酵、熟成與經典調酒，每一步都說明原因。">
<meta name="theme-color" content="#2F6B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="西餐練習簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!--FONTS-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<!--/FONTS-->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--BODY-->
<div class="wrap">
  <div class="top">
    <button type="button" class="brand" id="home">西餐練習簿<small>CUISINE &amp; COCKTAILS</small></button>
    <div class="count">做過<br><b id="pcount">0</b> 道</div>
  </div>
  <main id="view"></main>
</div>

<div class="tbar" id="tbar" hidden>
  <span class="clock" id="clock">00:00</span>
  <span class="tl" id="tlabel"></span>
  <button type="button" id="tpause">暫停</button>
  <button type="button" id="tplus">+1 分</button>
  <button type="button" id="treset">關閉</button>
</div>

<nav class="nav" aria-label="主選單">
  <button type="button" data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3.5"/><path d="M2.5 4v5M4 4v16M5.5 4v5M2.5 9h3M21 4c-1.5 1-2 3-2 6h2v10"/></svg>料理</button>
  <button type="button" data-tab="drink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14l-7 8z"/><path d="M12 12v8M8 20h8"/><path d="M16 4l2-2"/></svg>調酒</button>
  <button type="button" data-tab="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>收藏</button>
  <button type="button" data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.6"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>清單</button>
  <button type="button" data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13.5"/></svg>小教室</button>
</nav>
<!--/BODY-->
<!--SCRIPTS-->
<script src="js/data-food-1.js"></script>
<script src="js/data-food-2.js"></script>
<script src="js/data-food-3.js"></script>
<script src="js/data-drinks.js"></script>
<script src="js/data-learn.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
<!--/SCRIPTS-->
<script>
if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
